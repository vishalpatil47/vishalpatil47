<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b14"/><stop offset="1" stop-color="#101a30"/></linearGradient>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
<stop offset="0" stop-color="#00F5A0"/><stop offset="0.5" stop-color="#00B8D9"/><stop offset="1" stop-color="#B388FF"/>
<animate attributeName="x1" values="0;-1;0" dur="8s" repeatCount="indefinite"/><animate attributeName="x2" values="1;0;1" dur="8s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00F5A0"/><stop offset="0.5" stop-color="#7B2FF7"/><stop offset="1" stop-color="#00B8D9"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/></pattern>
<clipPath id="clip"><rect width="1000" height="300" rx="22"/></clipPath>
</defs>
<style>
.b1{animation:f1 9s ease-in-out infinite alternate}
.b2{animation:f2 11s ease-in-out infinite alternate}
.b3{animation:f3 13s ease-in-out infinite alternate}
@keyframes f1{to{transform:translate(260px,50px)}}
@keyframes f2{to{transform:translate(-240px,-40px)}}
@keyframes f3{to{transform:translate(-120px,60px)}}
.tw{opacity:.2;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:1}}
.l{opacity:0;animation:cyc 12s infinite}
.l2{animation-delay:3s}.l3{animation-delay:6s}.l4{animation-delay:9s}
@keyframes cyc{0%{opacity:0;transform:translateY(10px)}4%{opacity:1;transform:translateY(0)}21%{opacity:1;transform:translateY(0)}25%{opacity:0;transform:translateY(-8px)}100%{opacity:0}}
.ln{stroke-dasharray:300;stroke-dashoffset:300;animation:dr 2.2s .3s ease-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.nm{animation:rise 1.2s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.pulse{animation:pl 2s ease-in-out infinite}
@keyframes pl{50%{opacity:.3}}
</style>
<g clip-path="url(#clip)">
<rect width="1000" height="300" fill="url(#bg)"/>
<rect width="1000" height="300" fill="url(#grid)"/>
<g filter="url(#blur)">
<circle class="b1" cx="150" cy="80" r="110" fill="#00F5A0" fill-opacity=".45"/>
<circle class="b2" cx="820" cy="220" r="130" fill="#7B2FF7" fill-opacity=".55"/>
<circle class="b3" cx="520" cy="60" r="90" fill="#00B8D9" fill-opacity=".4"/>
</g>
