<text x="428" y="93" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="14" fill="#00F5A0" letter-spacing="3">HELLO, WORLD  /&gt;</text>
<text class="nm" x="500" y="168" text-anchor="middle" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="80" font-weight="800" letter-spacing="8" fill="url(#tg)">VISHAL PATIL</text>
<line class="ln" x1="350" y1="190" x2="650" y2="190" stroke="url(#bd)" stroke-width="3" stroke-linecap="round"/>
<text x="500" y="222" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="22" fill="#9FFCE0" class="l l1">Full Stack .NET Developer</text>
<text x="500" y="222" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="22" fill="#9FFCE0" class="l l2">Turning complex problems into clean code</text>
<text x="500" y="222" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="22" fill="#9FFCE0" class="l l3">Tech explorer and video creator</text>
<text x="500" y="222" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="22" fill="#9FFCE0" class="l l4">Building a tech news blog</text>
